<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" fill="none">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="logo-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8B5CF6"/>
      <stop offset="50%" stop-color="#6366F1"/>
      <stop offset="100%" stop-color="#4F46E5"/>
    </linearGradient>

    <!-- Subtle Inner Glow -->
    <radialGradient id="logo-glow" cx="30%" cy="20%" r="80%">
      <stop offset="0%" stop-color="#DDD6FE" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#4338CA" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Rounded Gradient App Badge -->
  <rect width="120" height="120" rx="28" fill="url(#logo-bg)"/>
  <rect width="120" height="120" rx="28" fill="url(#logo-glow)"/>
  <rect width="120" height="120" rx="28" stroke="#FFFFFF" stroke-opacity="0.15" stroke-width="1"/>

  <!-- User's Curved Wings Geometric Logo Glyph -->
  <!-- Upper-left curved wing -->
  <path
    d="M15 58
       C25 44, 35 31, 43 22
       C57 22, 70 21, 82 14
       C74 29, 62 39, 49 46
       C38 52, 26 56, 15 58
       Z"
    fill="#FFFFFF"
  />

  <!-- Right/lower curved wing -->
  <path
    d="M82 14
       C78 29, 77 42, 80 55
       C82 66, 87 75, 94 83
       L72 106
       C69 91, 68 77, 69 63
       C70 50, 75 36, 82 14
       Z"
    fill="#FFFFFF"
  />
</svg>
